name: hymn
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  sqflite: ^2.3.6
  sqflite_common_ffi: ^2.3.6
  logger: ^2.0.2+1
  google_fonts: ^6.3.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  file_picker: ^10.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/hymn.json
    - assets/choruses.json
    - assets/data/content.json
    - assets/images/cover.png

  fonts:
    - family: DagbaniFont
      fonts:
        - asset: assets/fonts/DagbaniFont-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true
